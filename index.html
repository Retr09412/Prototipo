<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="PoliMóvil Express — Alimentación móvil Grab & Go en el campus. Reserva, paga y recoge sin filas." />
  <title>PoliMóvil Express</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/layout.css" />
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>

  <div class="app-shell">
    <!-- Sidebar (solo desktop) -->
    <aside class="sidebar" id="sidebar" aria-label="Navegación lateral"></aside>

    <!-- Contenido principal -->
    <div class="app-content">
      <header class="app-topbar" id="topbar"></header>
      <main class="app-main" id="app" tabindex="-1"></main>
    </div>
  </div>

  <!-- Bottom navigation (solo móvil) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal"></nav>

  <!-- Overlays -->
  <div class="overlay" id="overlay" hidden></div>
  <div class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Carrito de compras" hidden></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
